<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLabs Content Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --orange: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    body {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ── Modal PAT ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 480px;
      max-width: 90vw;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .modal p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .modal input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal button:hover { background: var(--accent-hover); }

    .modal .error-msg {
      color: var(--red);
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Header ── */
    .header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .header h1 span { color: var(--text-muted); font-weight: 400; }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-list {
      list-style: none;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }

    .sidebar-list li {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
      color: var(--text-muted);
    }

    .sidebar-list li:hover { background: var(--bg-tertiary); color: var(--text); }
    .sidebar-list li.active { background: var(--bg-tertiary); color: var(--accent); }

    .sidebar-list .count {
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    .sidebar-footer a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    .sidebar-footer a:hover { text-decoration: underline; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      flex: 1;
      padding: 8px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
    }

    .search-box:focus { outline: none; border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-muted); }

    .stats {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Articles ── */
    .articles {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--accent); }

    .card-header {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-project {
      font-size: 11px;
      color: var(--purple);
      background: rgba(188, 140, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .tag {
      font-size: 11px;
      color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-published { color: var(--green); background: rgba(63, 185, 80, 0.1); }
    .status-draft { color: var(--orange); background: rgba(210, 153, 34, 0.1); }
    .status-review { color: var(--purple); background: rgba(188, 140, 255, 0.1); }

    .card-description {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .card-chevron {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .card.open .card-chevron { transform: rotate(90deg); }

    .card-body {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }

    .card.open .card-body { display: block; }

    .card-body .markdown-content {
      padding-top: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
    }

    .markdown-content h1, .markdown-content h2, .markdown-content h3 {
      color: var(--accent);
      margin: 20px 0 10px;
    }

    .markdown-content h1 { font-size: 20px; }
    .markdown-content h2 { font-size: 17px; }
    .markdown-content h3 { font-size: 15px; }

    .markdown-content p { margin: 10px 0; }

    .markdown-content code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .markdown-content pre {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .markdown-content pre code {
      background: none;
      padding: 0;
    }

    .markdown-content a { color: var(--accent); }
    .markdown-content ul, .markdown-content ol { padding-left: 24px; margin: 10px 0; }
    .markdown-content li { margin: 4px 0; }

    .markdown-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      color: var(--text-muted);
      margin: 12px 0;
    }

    .markdown-content img { max-width: 100%; border-radius: 8px; }

    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }

    .markdown-content th, .markdown-content td {
      padding: 8px 12px;
      border: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
    }

    .markdown-content th { background: var(--bg-tertiary); }

    /* ── Loading / Error ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 20px;
      margin: 20px 24px;
      border-radius: 8px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 36px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<div id="app" class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="header">
      <h1>JLabs <span>Content Hub</span></h1>
    </div>
    <ul id="sidebar-list" class="sidebar-list"></ul>
    <div class="sidebar-footer">
      <a id="reset-pat" title="Supprimer le token GitHub">Reset PAT</a>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="toolbar">
      <input id="search" class="search-box" type="text" placeholder="Rechercher un article...">
      <span id="stats" class="stats"></span>
    </div>
    <div id="articles" class="articles">
      <div class="loading"><div class="spinner"></div>Chargement...</div>
    </div>
  </div>
</div>

<!-- Modal PAT -->
<div id="pat-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>GitHub Personal Access Token</h2>
    <p>
      Ce dashboard lit vos fichiers markdown depuis GitHub.<br>
      Creez un token avec le scope <code>repo</code> dans
      Settings &gt; Developer settings &gt; Personal access tokens.
    </p>
    <div id="pat-error" class="error-msg"></div>
    <input id="pat-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button id="pat-submit">Connecter</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// Configuration — remplacer par vos valeurs
// ══════════════════════════════════════════
const GITHUB_OWNER = 'jonathanvouilloz';
const GITHUB_REPO  = 'jlabs-content-hub';

// ══════════════════════════════════════════
// State
// ══════════════════════════════════════════
let articles = [];
let projects = [];
let activeProject = null; // null = tous
let expandedCard = null;

// ══════════════════════════════════════════
// DOM refs
// ══════════════════════════════════════════
const $modal     = document.getElementById('pat-modal');
const $patInput  = document.getElementById('pat-input');
const $patSubmit = document.getElementById('pat-submit');
const $patError  = document.getElementById('pat-error');
const $sidebar   = document.getElementById('sidebar-list');
const $articles  = document.getElementById('articles');
const $search    = document.getElementById('search');
const $stats     = document.getElementById('stats');
const $resetPat  = document.getElementById('reset-pat');

// ══════════════════════════════════════════
// PAT management
// ══════════════════════════════════════════
function getPat() { return localStorage.getItem('jlabs_gh_pat'); }
function setPat(token) { localStorage.setItem('jlabs_gh_pat', token); }
function clearPat() { localStorage.removeItem('jlabs_gh_pat'); }

function showModal(errorMsg) {
  $modal.style.display = 'flex';
  if (errorMsg) {
    $patError.textContent = errorMsg;
    $patError.style.display = 'block';
  } else {
    $patError.style.display = 'none';
  }
  $patInput.value = '';
  $patInput.focus();
}

function hideModal() { $modal.style.display = 'none'; }

$patSubmit.addEventListener('click', async () => {
  const token = $patInput.value.trim();
  if (!token) return;
  setPat(token);
  hideModal();
  await loadData();
});

$patInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $patSubmit.click();
});

$resetPat.addEventListener('click', () => {
  clearPat();
  showModal();
});

// ══════════════════════════════════════════
// GitHub API
// ══════════════════════════════════════════
async function ghFetch(url) {
  const pat = getPat();
  const res = await fetch(url, {
    headers: {
      Authorization: `token ${pat}`,
      Accept: 'application/vnd.github.v3+json',
    },
  });

  if (res.status === 401 || res.status === 403) {
    const data = await res.json().catch(() => ({}));
    if (res.status === 403 && data.message && data.message.includes('rate limit')) {
      throw new Error('Rate limit GitHub atteint. Attendez quelques minutes avant de recharger.');
    }
    clearPat();
    showModal('Token invalide ou expire. Veuillez en saisir un nouveau.');
    throw new Error('auth');
  }

  if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
  return res.json();
}

async function fetchTree() {
  const data = await ghFetch(
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/main?recursive=1`
  );
  return data.tree
    .filter(f => f.type === 'blob' && f.path.endsWith('.md'))
    .filter(f => !f.path.startsWith('dashboard/'))
    .filter(f => f.path !== 'README.md');
}

async function fetchFileContent(path) {
  const data = await ghFetch(
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeURIComponent(path)}`
  );
  return atob(data.content);
}

// ══════════════════════════════════════════
// Frontmatter parsing
// ══════════════════════════════════════════
function parseFrontmatter(content) {
  const fm = { title: '', date: '', tags: [], status: '', description: '', body: content };

  if (!content.startsWith('---')) return fm;

  const end = content.indexOf('---', 3);
  if (end === -1) return fm;

  const yamlBlock = content.substring(3, end).trim();
  fm.body = content.substring(end + 3).trim();

  for (const line of yamlBlock.split('\n')) {
    const sep = line.indexOf(':');
    if (sep === -1) continue;
    const key = line.substring(0, sep).trim().toLowerCase();
    let val = line.substring(sep + 1).trim();

    // Remove surrounding quotes
    if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
      val = val.slice(1, -1);
    }

    if (key === 'title') fm.title = val;
    else if (key === 'date') fm.date = val;
    else if (key === 'status') fm.status = val.toLowerCase();
    else if (key === 'description') fm.description = val;
    else if (key === 'tags') {
      // Handle [tag1, tag2] or tag1, tag2
      val = val.replace(/^\[/, '').replace(/\]$/, '');
      fm.tags = val.split(',').map(t => t.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
    }
  }

  return fm;
}

// ══════════════════════════════════════════
// Data loading
// ══════════════════════════════════════════
async function loadData() {
  $articles.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement...</div>';

  try {
    const tree = await fetchTree();

    articles = tree.map(file => {
      const parts = file.path.split('/');
      const project = parts.length > 1 ? parts[0] : '_root';
      return { path: file.path, project, sha: file.sha, frontmatter: null, content: null };
    });

    // Extract unique projects sorted
    const projectSet = new Map();
    articles.forEach(a => {
      projectSet.set(a.project, (projectSet.get(a.project) || 0) + 1);
    });
    projects = Array.from(projectSet.entries())
      .sort((a, b) => a[0].localeCompare(b[0]));

    // Fetch content for all articles (in batches to avoid rate limits)
    const batchSize = 10;
    for (let i = 0; i < articles.length; i += batchSize) {
      const batch = articles.slice(i, i + batchSize);
      await Promise.all(batch.map(async (article) => {
        try {
          const raw = await fetchFileContent(article.path);
          const fm = parseFrontmatter(raw);
          article.frontmatter = fm;
          article.content = raw;
        } catch (e) {
          if (e.message === 'auth') throw e;
          article.frontmatter = {
            title: article.path.split('/').pop().replace('.md', ''),
            date: '', tags: [], status: '', description: '',
            body: ''
          };
        }
      }));
    }

    // Sort by date descending
    articles.sort((a, b) => {
      const da = a.frontmatter?.date || '';
      const db = b.frontmatter?.date || '';
      return db.localeCompare(da);
    });

    renderSidebar();
    renderArticles();

  } catch (e) {
    if (e.message === 'auth') return;
    $articles.innerHTML = `<div class="error-banner">${e.message}</div>`;
  }
}

// ══════════════════════════════════════════
// Rendering
// ══════════════════════════════════════════
function renderSidebar() {
  const total = articles.length;
  let html = `<li class="${activeProject === null ? 'active' : ''}" data-project="__all">
    <span>Tous</span><span class="count">${total}</span>
  </li>`;

  for (const [name, count] of projects) {
    const label = name === '_root' ? 'Racine' : name;
    html += `<li class="${activeProject === name ? 'active' : ''}" data-project="${name}">
      <span>${label}</span><span class="count">${count}</span>
    </li>`;
  }

  $sidebar.innerHTML = html;

  $sidebar.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      const p = li.dataset.project;
      activeProject = p === '__all' ? null : p;
      expandedCard = null;
      renderSidebar();
      renderArticles();
    });
  });
}

function getFilteredArticles() {
  const query = $search.value.toLowerCase().trim();
  return articles.filter(a => {
    if (activeProject && a.project !== activeProject) return false;
    if (query) {
      const title = (a.frontmatter?.title || a.path).toLowerCase();
      if (!title.includes(query)) return false;
    }
    return true;
  });
}

function renderArticles() {
  const filtered = getFilteredArticles();
  $stats.textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    $articles.innerHTML = `
      <div class="empty-state">
        <div class="icon">📄</div>
        <p>Aucun article trouve.</p>
      </div>`;
    return;
  }

  let html = '';
  for (const article of filtered) {
    const fm = article.frontmatter || {};
    const title = fm.title || article.path.split('/').pop().replace('.md', '');
    const isOpen = expandedCard === article.path;

    let statusClass = '';
    if (fm.status === 'published' || fm.status === 'publie') statusClass = 'status-published';
    else if (fm.status === 'draft' || fm.status === 'brouillon') statusClass = 'status-draft';
    else if (fm.status === 'review') statusClass = 'status-review';
    else if (fm.status) statusClass = 'status-draft';

    html += `<div class="card ${isOpen ? 'open' : ''}" data-path="${article.path}">
      <div class="card-header">
        <div>
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="card-meta">
            ${fm.date ? `<span class="card-date">${escapeHtml(fm.date)}</span>` : ''}
            <span class="card-project">${escapeHtml(article.project === '_root' ? 'Racine' : article.project)}</span>
            ${fm.status ? `<span class="status ${statusClass}">${escapeHtml(fm.status)}</span>` : ''}
            ${fm.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          ${fm.description ? `<div class="card-description">${escapeHtml(fm.description)}</div>` : ''}
        </div>
        <span class="card-chevron">▶</span>
      </div>
      <div class="card-body">
        <div class="markdown-content">${isOpen ? renderMarkdown(fm.body || '') : ''}</div>
      </div>
    </div>`;
  }

  $articles.innerHTML = html;

  $articles.querySelectorAll('.card-header').forEach(header => {
    header.addEventListener('click', () => {
      const card = header.parentElement;
      const path = card.dataset.path;

      if (expandedCard === path) {
        expandedCard = null;
        card.classList.remove('open');
        card.querySelector('.card-body').style.display = 'none';
      } else {
        // Close previously open card
        if (expandedCard) {
          const prev = $articles.querySelector(`.card[data-path="${CSS.escape(expandedCard)}"]`);
          if (prev) {
            prev.classList.remove('open');
            prev.querySelector('.card-body').style.display = 'none';
          }
        }
        expandedCard = path;
        card.classList.add('open');
        const body = card.querySelector('.card-body');
        const article = articles.find(a => a.path === path);
        body.querySelector('.markdown-content').innerHTML = renderMarkdown(article?.frontmatter?.body || '');
        body.style.display = 'block';
      }
    });
  });
}

function renderMarkdown(md) {
  try { return marked.parse(md); }
  catch { return `<pre>${escapeHtml(md)}</pre>`; }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ══════════════════════════════════════════
// Search
// ══════════════════════════════════════════
$search.addEventListener('input', () => {
  expandedCard = null;
  renderArticles();
});

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
(async function init() {
  if (!getPat()) {
    showModal();
  } else {
    await loadData();
  }
})();
</script>
</body>
</html>
